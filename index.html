<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — My Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
      color: #e2e8f0;
      padding: 2rem;
    }

    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 4rem 3rem;
      max-width: 28rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
    }

    .card h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .card .tag {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.4rem 1.1rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 999px;
      border: 1px solid rgba(165, 180, 252, 0.4);
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome</h1>
    <p>Hello, and thanks for stopping by. This is my website — freshly built, and just getting started.</p>
    <span class="tag">Est. 2026</span>
  </main>
</body>
</html>
