<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — My Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef9c3 0%, #fde047 50%, #facc15 100%);
      color: #1f2937;
      padding: 2rem;
    }

    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 4rem 3rem;
      max-width: 28rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
    }

    .card h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #78350f, #b45309, #d97706);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #374151;
    }

    .card .tag {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.4rem 1.1rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 999px;
      border: 1px solid rgba(120, 53, 15, 0.4);
      color: #78350f;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome</h1>
    <p>Hello, and thanks for stopping by. This is my website — freshly built, and just getting started.</p>
    <span class="tag">Est. 2026</span>
  </main>
</body>
</html>
